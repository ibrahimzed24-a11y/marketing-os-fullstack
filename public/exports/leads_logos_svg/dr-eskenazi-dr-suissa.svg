<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="grad_dr_eskenazi_dr_suissa_main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="grad_dr_eskenazi_dr_suissa_shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Transparent Container Canvas -->
  <rect width="400" height="120" fill="transparent"/>

  <!-- Brand Emblem Vector Crest -->
  <g id="brand-crest">
    
        <rect x="25" y="16" width="80" height="88" rx="22" fill="url(#grad_dr_eskenazi_dr_suissa_main)" filter="url(#grad_dr_eskenazi_dr_suissa_shadow)"/>
        <rect x="29" y="20" width="72" height="80" rx="18" fill="none" stroke="#6366F1" stroke-width="1.5" opacity="0.5"/>
        <!-- Dual Curving Tooth Outline -->
        <path d="M48 42 C48 34 57 32 65 38 C73 32 82 34 82 42 C82 56 78 66 72 75 C69 79 66 79 65 74 C64 79 61 79 58 75 C52 66 48 56 48 42 Z" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
        <!-- Ampersand & Monogram Center -->
        <circle cx="65" cy="56" r="16" fill="#6366F1"/>
        <text x="65" y="62" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">&amp;</text>
        <!-- Monogram Base -->
        <rect x="44" y="82" width="42" height="15" rx="7.5" fill="#EEF2FF"/>
        <text x="65" y="93" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="900" fill="#4F46E5" text-anchor="middle" letter-spacing="1.5">E&amp;S</text>
        
  </g>

  <!-- Clean Brand Typography -->
  <g id="brand-typography">
    <!-- Primary Clinic Name -->
    <text x="124" y="50" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#0F172A" letter-spacing="0.2">DR ESKENAZI &amp; DR SUISSA</text>
    <!-- Secondary Designation -->
    <text x="125" y="71" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#4F46E5" letter-spacing="2.2">CHIRURGIENS DENTISTES</text>
    <!-- Location & Credential Tag -->
    <text x="125" y="89" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#64748B" letter-spacing="1.2">PIERREFONDS • PRATIQUE PRIVÉE</text>
  </g>
</svg>