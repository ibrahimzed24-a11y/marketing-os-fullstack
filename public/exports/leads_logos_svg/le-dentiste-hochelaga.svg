<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="grad_le_dentiste_hochelaga_main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <filter id="grad_le_dentiste_hochelaga_shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Transparent Container Canvas -->
  <rect width="400" height="120" fill="transparent"/>

  <!-- Brand Emblem Vector Crest -->
  <g id="brand-crest">
    
        <circle cx="65" cy="60" r="44" fill="url(#grad_le_dentiste_hochelaga_main)" filter="url(#grad_le_dentiste_hochelaga_shadow)"/>
        <!-- Heart / Smile Arch Outer Glow -->
        <path d="M65 86 C40 68 32 50 42 36 C50 26 62 30 65 38 C68 30 80 26 88 36 C98 50 90 68 65 86 Z" fill="#E11D48" opacity="0.35"/>
        <!-- Pure White Tooth Silhouette -->
        <path d="M53 44 C53 36 60 33 65 38 C70 33 77 36 77 44 C77 55 74 64 69 73 C67 77 65 77 65 72 C65 77 63 77 61 73 C56 64 53 55 53 44 Z" fill="#FFFFFF"/>
        <!-- Coral Smile Arc -->
        <path d="M56 54 Q65 64 74 54" fill="none" stroke="#E11D48" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Monogram Pill -->
        <rect x="49" y="82" width="32" height="14" rx="7" fill="#E11D48"/>
        <text x="65" y="93" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">DH</text>
        
  </g>

  <!-- Clean Brand Typography -->
  <g id="brand-typography">
    <!-- Primary Clinic Name -->
    <text x="124" y="53" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#1E1B4B" letter-spacing="0.2">LE DENTISTE</text>
    <!-- Secondary Designation -->
    <text x="125" y="74" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#BE123C" letter-spacing="2.2">HOCHELAGA</text>
    <!-- Location & Credential Tag -->
    <text x="125" y="92" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#64748B" letter-spacing="1.2">MONTRÉAL • SOINS DENTAIRES</text>
  </g>
</svg>