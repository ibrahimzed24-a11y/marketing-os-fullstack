<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="grad_micmac_dental_centre_dr_dessureault_main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C4A6E"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="grad_micmac_dental_centre_dr_dessureault_shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Transparent Container Canvas -->
  <rect width="400" height="120" fill="transparent"/>

  <!-- Brand Emblem Vector Crest -->
  <g id="brand-crest">
    
        <path d="M26 24 C26 24 65 14 65 14 C65 14 104 24 104 24 C104 60 90 88 65 106 C40 88 26 60 26 24 Z" fill="url(#grad_micmac_dental_centre_dr_dessureault_main)" filter="url(#grad_micmac_dental_centre_dr_dessureault_shadow)"/>
        <!-- Light Beams from Crown -->
        <polygon points="65,24 35,68 95,68" fill="#D97706" opacity="0.3"/>
        <!-- Tooth Silhouette -->
        <path d="M53 44 C53 36 60 33 65 38 C70 33 77 36 77 44 C77 55 74 64 69 73 C67 77 65 77 65 72 C65 77 63 77 61 73 C56 64 53 55 53 44 Z" fill="#FFFFFF"/>
        <!-- Maritime Beacon Star -->
        <circle cx="65" cy="28" r="4" fill="#D97706"/>
        <!-- Monogram -->
        <rect x="47" y="84" width="36" height="14" rx="7" fill="#D97706"/>
        <text x="65" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">MM</text>
        
  </g>

  <!-- Clean Brand Typography -->
  <g id="brand-typography">
    <!-- Primary Clinic Name -->
    <text x="124" y="50" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#0C4A6E" letter-spacing="0.2">MICMAC DENTAL CENTRE</text>
    <!-- Secondary Designation -->
    <text x="125" y="71" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#D97706" letter-spacing="2.2">DR. DESSUREAULT &amp; ASSOCIATES</text>
    <!-- Location & Credential Tag -->
    <text x="125" y="89" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#64748B" letter-spacing="1.2">DARTMOUTH NS • ATLANTIC EXCELLENCE</text>
  </g>
</svg>