:root {

  function sparkline(values, tone = 'lime') {
    const max = Math.max(...values), min = Math.min(...values);
    const pts = values.map((v, i) => `${(i / (values.length - 1)) * 100},${34 - ((v - min) / (max - min || 1)) * 26}`).join(' ');
    return `<svg class="sparkline sparkline-${tone}" viewBox="0 0 100 38" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }

  function miniBars(values, tone = 'indigo') {
    return `<div class="mini-bars bars-${tone}">${values.map((v) => `<span style="height:${v}%"></span>`).join('')}</div>`;
  }

    if (activeId) {
      const el = document.getElementById(activeId);
      if (el) { el.focus(); if (typeof selStart === 'number' && el.setSelectionRange) el.setSelectionRange(selStart, selStart); }
    }
  }

  function executeCommandItem(item) {
    if (!item) return;
    state.commandOpen = false;
    state.commandQuery = '';
    if (item.kind === 'nav') state.view = item.id;
    else if (item.kind === 'campaign') state.drawer = { type: 'campaign', id: item.id };
    else if (item.kind === 'approval') state.drawer = { type: 'approval', id: item.id };
    render();
  }

  document.addEventListener('click', (e) => {
    const navBtn = e.target.closest('[data-nav]');
    if (navBtn) {
      state.view = navBtn.dataset.nav;
      state.mobileMenuOpen = false;
      render();
      return;
    }
    const act = e.target.closest('[data-action]');
    if (!act) return;
    const action = act.dataset.action;
    if (action === 'open-command') { state.commandOpen = true; state.commandIndex = 0; render(); setTimeout(() => document.getElementById('cmd-input')?.focus(), 10); }
    else if (action === 'cmd-close' && e.target === act) { state.commandOpen = false; render(); }
    else if (action === 'cmd-select') executeCommandItem(getCommandResults()[Number(act.dataset.idx)]);
    else if (action === 'open-modal') { state.presetService = ''; state.modal = act.dataset.modal; render(); }
    else if (action === 'open-preset') { state.presetService = act.dataset.preset; state.modal = 'preset'; render(); }
    else if (action === 'close-modal' || (action === 'overlay-close' && e.target === act)) { state.modal = null; render(); }
    else if (action === 'open-approval') { state.drawer = { type: 'approval', id: act.dataset.id }; render(); }
    else if (action === 'open-campaign') { state.drawer = { type: 'campaign', id: act.dataset.id }; render(); }
    else if (action === 'open-asset') { state.drawer = { type: 'asset', id: act.dataset.id }; render(); }
    else if (action === 'open-notifs') { state.drawer = { type: 'notifications' }; render(); }
    else if (action === 'close-drawer' || (action === 'drawer-close' && e.target === act)) { state.drawer = null; render(); }
    else if (action === 'filter-activity') { state.activityFilter = act.dataset.val; render(); }
    else if (action === 'filter-approval') { state.approvalFilter = act.dataset.val; render(); }
    else if (action === 'filter-project') { state.projectFilter = act.dataset.val; render(); }
    else if (action === 'dept-tab') { state.deptTab[act.dataset.dept] = act.dataset.tab; render(); }
    else if (action === 'toggle-mobile-menu') { state.mobileMenuOpen = !state.mobileMenuOpen; render(); }
    else if (action === 'close-mobile-menu' && (e.target === act || act.tagName === 'BUTTON')) { state.mobileMenuOpen = false; render(); }
    else if (action === 'close-toast') { state.toast = ''; render(); }
    else if (action === 'toast') showToast(act.dataset.msg);
    else if (action === 'toggle-setting') {
      const k = act.dataset.key;
      state.toggles[k] = !state.toggles[k];
      showToast(`${k === 'aiEngine' ? 'AI engine' : k === 'approvalGates' ? 'Approval gates' : 'Live stream'} ${state.toggles[k] ? 'enabled' : 'paused'}.`);
    }
    else if (action === 'toggle-engine') {
      state.engineConnected = !state.engineConnected;
      showToast(state.engineConnected ? 'Dual-engine runner reconnected.' : 'Dual-engine runner paused.');
    }
    else if (action === 'test-connections') {
      state.engineConnected = true;
      showToast('All 4 workspace integrations responded healthy.');
    }
    else if (action === 'read-notif') {
      const n = state.notifications.find((x) => x.id === act.dataset.id);
      if (n) n.unread = false;
      state.drawer = null;
      if (n?.targetView) state.view = n.targetView;
      showToast('Opened from notification.');
    }
    else if (action === 'read-all-notifs') {
      state.notifications.forEach((n) => (n.unread = false));
      showToast('All notifications marked as read.');
    }
    else if (action === 'decide-approval') {
      const a = state.approvals.find((x) => x.id === act.dataset.id);
      const dec = act.dataset.decision;
      if (a) a.status = dec;
      state.activity.unshift({
        id: Date.now(), type: 'approval',
        title: dec === 'approved' ? `Approved: ${a.title}` : `Revision requested: ${a.title}`,
        detail: `${a.project} · ${a.id}`, time: 'Just now', tone: dec === 'approved' ? 'lime' : 'coral', initials: 'IZ'
      });
      if (dec === 'approved') state.drawer = null;
      showToast(dec === 'approved' ? 'Approved — marked production-ready.' : 'Revision requested — owner notified.');
    }
  });

  document.addEventListener('input', (e) => {
    if (e.target.id === 'knowledge-search') { state.knowledgeQuery = e.target.value; render(); }
    else if (e.target.id === 'cmd-input') { state.commandQuery = e.target.value; state.commandIndex = 0; render(); }
  });

  document.addEventListener('submit', (e) => {
    e.preventDefault();
    if (e.target.id === 'project-form') {
      const name = document.getElementById('proj-name').value.trim();
      const tag = document.getElementById('proj-type').value;
      if (!name) return;
      state.campaigns.unshift({ id: 'c' + Date.now(), name, client: 'Marketing OS', stage: 'Briefing', health: 20, due: 'Next week', tag, tone: 'indigo', approvalId: null });
      state.modal = null;
      state.view = 'projects';
      showToast(`Project "${name}" created.`);
    } else if (e.target.id === 'invite-form') {
      const name = document.getElementById('inv-name').value.trim();
      const role = document.getElementById('inv-role').value;
      const team = document.getElementById('inv-dept').value;
      if (!name) return;
      const initials = name.split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase();
      state.team.unshift({ name, role, team, status: 'Available', initials, tone: 'indigo' });
      state.modal = null;
      showToast(`Invited ${name} (${role}).`);
    } else if (e.target.id === 'knowledge-form') {
      const title = document.getElementById('know-title').value.trim();
      const type = document.getElementById('know-type').value;
      if (!title) return;
      state.knowledgeAssets.unshift({ id: 'k' + Date.now(), title, type, updated: 'Just now', size: '120 KB', color: 'indigo', summary: 'Newly indexed context ready for pipeline grounding.' });
      state.modal = null;
      showToast(`"${title}" indexed into Knowledge Base.`);
    }
  });

  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      state.commandOpen = !state.commandOpen;
      state.commandIndex = 0;
      render();
      if (state.commandOpen) setTimeout(() => document.getElementById('cmd-input')?.focus(), 10);
    } else if (e.key === 'Escape') {
      if (state.commandOpen || state.modal || state.drawer || state.mobileMenuOpen) {
        state.commandOpen = false; state.modal = null; state.drawer = null; state.mobileMenuOpen = false;
        render();
      }
    } else if (state.commandOpen) {
      const results = getCommandResults();
      if (e.key === 'ArrowDown' && results.length) { e.preventDefault(); state.commandIndex = (state.commandIndex + 1) % results.length; render(); }
      else if (e.key === 'ArrowUp' && results.length) { e.preventDefault(); state.commandIndex = (state.commandIndex - 1 + results.length) % results.length; render(); }
      else if (e.key === 'Enter' && results.length) { e.preventDefault(); executeCommandItem(results[state.commandIndex]); }
    }
  });

  render();
})();
    </script>
  </body>
</html>
